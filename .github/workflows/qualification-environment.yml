name: Qualification Environment

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/qualification-environment.yml"
      - "experiments/profiles/cloud_qualification_environment.json"
      - "tools/cloud_qualification_environment.py"
      - "docs/decisions/CLOUD_QUALIFICATION_ENVIRONMENT_DECISION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-environment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-matrix:
    name: ${{ matrix.preset }} / QUALIFICATION ENVIRONMENT
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        preset:
          - gcc-debug
          - gcc-release
          - clang-debug
          - clang-release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact declared Ubuntu packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake=3.28.3-1build7 \
            ninja-build=1.11.1-2 \
            g++-13=13.3.0-6ubuntu2~24.04.1 \
            clang-18=1:18.1.3-1ubuntu1 \
            libc++-18-dev=1:18.1.3-1ubuntu1 \
            libc++abi-18-dev=1:18.1.3-1ubuntu1

      - name: Validate environment identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "qualification-environment/${{ matrix.preset }}"
          /usr/bin/python3 tools/cloud_qualification_environment.py \
            --profile experiments/profiles/cloud_qualification_environment.json \
            --cell "${{ matrix.preset }}" \
            --output "qualification-environment/${{ matrix.preset }}/environment.json"

      - name: Configure with declared system build tools
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/cmake \
            --preset "${{ matrix.preset }}" \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja
          grep -Fx "APMESH_ENABLE_QUALIFICATION_TESTS:BOOL=OFF" \
            "build/${{ matrix.preset }}/CMakeCache.txt"
          grep -Fx "CMAKE_MAKE_PROGRAM:FILEPATH=/usr/bin/ninja" \
            "build/${{ matrix.preset }}/CMakeCache.txt"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Verify exact semantic inventory
        shell: bash
        run: |
          set -euo pipefail
          INVENTORY="qualification-environment/${{ matrix.preset }}/ctest-inventory.json"
          /usr/bin/ctest \
            --test-dir "build/${{ matrix.preset }}" \
            --show-only=json-v1 > "$INVENTORY"
          /usr/bin/python3 - "$INVENTORY" experiments/profiles/cloud_qualification_environment.json <<'PY'
          import json
          import pathlib
          import sys

          inventory = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          profile = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          observed = [test["name"] for test in inventory["tests"]]
          expected = profile["semantic_ctest_allowlist"]
          if observed != expected:
              raise SystemExit(
                  "semantic CTest inventory differs:\n"
                  f"expected={expected}\nobserved={observed}"
              )
          print(f"PASS: exact semantic inventory ({len(observed)} tests)")
          PY

      - name: Run current semantic regression
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest --preset "${{ matrix.preset }}" 2>&1 \
            | tee "qualification-environment/${{ matrix.preset }}/ctest.log"

      - name: Retain environment admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-environment-${{ matrix.preset }}
          path: qualification-environment/${{ matrix.preset }}
          if-no-files-found: error
          retention-days: 30

name: Continuous Curve Geometry Regression Formal Tooling

on:
  push:
    branches:
      - "curve/cgr-formal-*"
      - "curve/cgr-campaign-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgr-formal-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    name: ${{ matrix.name }} / CGR FORMAL TOOLING
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13 Debug
            compiler: /usr/bin/g++-13
            use_libcxx: "OFF"
            build_dir: build/cgr-formal-gcc-debug
          - name: Clang 18 libc++ Debug
            compiler: /usr/bin/clang++-18
            use_libcxx: "ON"
            build_dir: build/cgr-formal-clang-debug

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install declared tooling environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake=3.28.3-1build7 \
            ninja-build=1.11.1-2 \
            g++-13=13.3.0-6ubuntu2~24.04.1 \
            clang-18=1:18.1.3-1ubuntu1 \
            libc++-18-dev=1:18.1.3-1ubuntu1 \
            libc++abi-18-dev=1:18.1.3-1ubuntu1

      - name: Run formal runner self-check without preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          /usr/bin/python3 tools/run_continuous_curve_geometry_campaign.py \
            --source-root . \
            --profile experiments/profiles/continuous_curve_geometry_regression.json \
            --protocol docs/decisions/CURVE_CONTINUOUS_GEOMETRY_REGRESSION_PROTOCOL.md \
            --exporter experiments/continuous_curve_geometry_regression_export.cpp \
            --validator tools/continuous_curve_geometry_regression_evidence.py \
            --negative tools/continuous_curve_geometry_regression_negative.py \
            self-check \
            --output build/cgr-formal-self-check.json
          /usr/bin/python3 - build/cgr-formal-self-check.json <<'PY'
          import json
          import pathlib

          value = json.loads(pathlib.Path("build/cgr-formal-self-check.json").read_text(encoding="utf-8"))
          if value["status"] != "PASS":
              raise SystemExit("formal runner self-check did not pass")
          if value["execution_requested"] is not False:
              raise SystemExit("formal runner self-check requests execution")
          if value["formal_preparation"] is not False or value["formal_execution"] is not False:
              raise SystemExit("formal runner self-check claims lifecycle activity")
          if set(value["plan"]["gates"].values()) != {"NOT_EXECUTED"}:
              raise SystemExit("formal runner self-check claims a CGR gate")
          PY

      - name: Configure opt-in formal tooling
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/cmake \
            -S . \
            -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAPMESH_USE_LIBCXX="${{ matrix.use_libcxx }}" \
            -DBUILD_TESTING=ON \
            -DAPMESH_ENABLE_QUALIFICATION_TESTS=ON
          grep -Fx "APMESH_ENABLE_QUALIFICATION_TESTS:BOOL=ON" \
            "${{ matrix.build_dir }}/CMakeCache.txt"

      - name: Build CGR exporter
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/cmake --build "${{ matrix.build_dir }}" \
            --target apmesh_core_continuous_curve_geometry_regression_export \
            --parallel

      - name: Verify exact formal tooling inventory
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest \
            --test-dir "${{ matrix.build_dir }}" \
            --show-only=json-v1 > "${{ matrix.build_dir }}/ctest-inventory.json"
          /usr/bin/python3 - "${{ matrix.build_dir }}/ctest-inventory.json" <<'PY'
          import json
          import pathlib
          import sys

          inventory = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = [
              "apmesh_core.continuous_curve_geometry_regression_evidence",
              "apmesh_core.continuous_curve_geometry_regression_runner",
              "apmesh_core.continuous_curve_geometry_regression_workflow",
              "apmesh_core.continuous_curve_geometry_campaign_runner",
              "apmesh_core.continuous_curve_geometry_campaign_prepare_workflow",
              "apmesh_core.continuous_curve_geometry_campaign_execute_workflow",
              "apmesh_core.continuous_curve_geometry_regression_authorization",
              "apmesh_core.continuous_curve_geometry_regression_authorization_workflow",
          ]
          observed = [test["name"] for test in inventory["tests"] if test["name"] in expected]
          if observed != expected:
              raise SystemExit(
                  f"CGR formal tooling inventory differs: expected={expected}, observed={observed}"
              )
          print("PASS: exact CGR formal tooling inventory")
          PY

      - name: Run report-only CGR evidence contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure \
            -R '^apmesh_core\.continuous_curve_geometry_regression_evidence$'

      - name: Run report-only CGR runner contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure \
            -R '^apmesh_core\.continuous_curve_geometry_regression_runner$'

      - name: Run report-only CGR workflow contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure \
            -R '^apmesh_core\.continuous_curve_geometry_regression_workflow$'

      - name: Run formal CGR runner contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure \
            -R '^apmesh_core\.continuous_curve_geometry_campaign_runner$'

      - name: Run preparation-only workflow contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure \
            -R '^apmesh_core\.continuous_curve_geometry_campaign_prepare_workflow$'

      - name: Run reusable execution workflow contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure \
            -R '^apmesh_core\.continuous_curve_geometry_campaign_execute_workflow$'

      - name: Run authorization record contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure \
            -R '^apmesh_core\.continuous_curve_geometry_regression_authorization$'

      - name: Run authorization controller contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure \
            -R '^apmesh_core\.continuous_curve_geometry_regression_authorization_workflow$'

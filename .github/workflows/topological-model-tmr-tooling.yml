name: Topological Model TMR Tooling

on:
  push:
    branches:
      - "topology/tmr-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-tmr-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    name: ${{ matrix.name }} / TMR TOOLING
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13 Debug
            compiler: g++-13
            use_libcxx: "OFF"
            build_dir: build/tmr-gcc-debug
          - name: Clang 18 libc++ Debug
            compiler: clang++-18
            use_libcxx: "ON"
            build_dir: build/tmr-clang-debug

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install declared tooling environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends             cmake=3.28.3-1build7             ninja-build=1.11.1-2             g++-13=13.3.0-6ubuntu2~24.04.1             clang-18=1:18.1.3-1ubuntu1             libc++-18-dev=1:18.1.3-1ubuntu1             libc++abi-18-dev=1:18.1.3-1ubuntu1

      - name: Validate admitted cloud identity binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          /usr/bin/python3 tools/run_topological_model_cumulative.py \
            --source-root . \
            --profile experiments/profiles/topological_model_cumulative.json \
            --protocol docs/decisions/TOPOLOGICAL_MODEL_CUMULATIVE_REGRESSION_PROTOCOL.md \
            --exporter experiments/topological_model_cumulative_export.cpp \
            --validator tools/topological_model_cumulative_evidence.py \
            validate-cloud-environment \
            --output "build/tmr-cloud-environment-binding.json"

      - name: Configure opt-in tooling
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/cmake             -S .             -B "${{ matrix.build_dir }}"             -G Ninja             -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja             -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}"             -DCMAKE_BUILD_TYPE=Debug             -DAPMESH_USE_LIBCXX="${{ matrix.use_libcxx }}"             -DBUILD_TESTING=ON             -DAPMESH_ENABLE_QUALIFICATION_TESTS=ON
          grep -Fx "APMESH_ENABLE_QUALIFICATION_TESTS:BOOL=ON"             "${{ matrix.build_dir }}/CMakeCache.txt"

      - name: Build TMR exporter
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/cmake --build "${{ matrix.build_dir }}"             --target apmesh_core_topological_model_cumulative_export             --parallel

      - name: Verify focused tooling inventory
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest             --test-dir "${{ matrix.build_dir }}"             --show-only=json-v1 > "${{ matrix.build_dir }}/ctest-inventory.json"
          /usr/bin/python3 - "${{ matrix.build_dir }}/ctest-inventory.json" <<'PY'
          import json
          import pathlib
          import sys

          inventory = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = [
              "apmesh_core.topological_model_cumulative_evidence",
              "apmesh_core.topological_model_cumulative_runner",
              "apmesh_core.topological_model_cumulative_prepare_workflow",
              "apmesh_core.topological_model_cumulative_execute_workflow",
          ]
          observed = [test["name"] for test in inventory["tests"] if test["name"] in expected]
          if observed != expected:
              raise SystemExit(f"TMR tooling inventory differs: expected={expected}, observed={observed}")
          print("PASS: exact TMR focused tooling inventory")
          PY

      - name: Run report-only evidence contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest             --test-dir "${{ matrix.build_dir }}"             --output-on-failure             -R '^apmesh_core\.topological_model_cumulative_evidence$'

      - name: Run report-only runner contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest             --test-dir "${{ matrix.build_dir }}"             --output-on-failure             -R "^apmesh_core\.topological_model_cumulative_runner$"

      - name: Run preparation-only workflow contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest             --test-dir "${{ matrix.build_dir }}"             --output-on-failure             -R "^apmesh_core\.topological_model_cumulative_prepare_workflow$"

      - name: Run execution-only workflow contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ctest             --test-dir "${{ matrix.build_dir }}"             --output-on-failure             -R "^apmesh_core\.topological_model_cumulative_execute_workflow$"

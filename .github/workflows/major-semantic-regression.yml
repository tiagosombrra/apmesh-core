name: Major Semantic Regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: major-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-matrix:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        preset:
          - gcc-debug
          - gcc-release
          - clang-debug
          - clang-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install declared toolchain
        shell: bash
        run: |
          sudo apt-get update
          case "${{ matrix.preset }}" in
            gcc-*)
              sudo apt-get install --yes g++-13 ninja-build
              ;;
            clang-*)
              sudo apt-get install --yes clang-18 libc++-18-dev libc++abi-18-dev ninja-build
              ;;
          esac

      - name: Record environment
        shell: bash
        run: |
          uname -a
          cmake --version
          ninja --version
          case "${{ matrix.preset }}" in
            gcc-*) g++-13 --version ;;
            clang-*) clang++-18 --version ;;
          esac

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Run current semantic regression
        run: ctest --preset ${{ matrix.preset }}
